name: Deploy to ISDA Livestream Windows Machine

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -command ". \"{0}\""'
        working-directory: C:\isda-livestreamtool

    steps:
      - name: Pull latest code
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Install Python dependencies
        run: |
          pip install flask pygame visca-over-ip numpy pyyaml

      - name: Install Node dependencies
        run: |
          npm install

      - name: Build CSS
        run: |
          npm run build

      - name: Restart Flask app
        run: |
          # Stop any running python process, then restart via schtasks (persists after runner exits)
          Get-Process -Name "python*" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*app.py*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          schtasks /Run /TN "ISDA Live Stream"

      - name: Verify app is running
        run: |
          $maxRetries = 12
          $retry = 0
          $success = $false
          while ($retry -lt $maxRetries) {
            $retry++
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:5000/ -TimeoutSec 3
              if ($resp.StatusCode -eq 200) {
                $success = $true
                break
              }
            } catch { }
            Write-Output "Waiting for Flask app... attempt $retry/$maxRetries"
            Start-Sleep -Seconds 5
          }
          if (-not $success) {
            throw "Flask app failed to start after $maxRetries attempts"
          }
          Write-Output "✅ Flask app is running (HTTP $($resp.StatusCode))"

