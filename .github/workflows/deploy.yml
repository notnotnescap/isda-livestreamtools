name: Deploy to ISDA Livestream Windows Machine

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -command ". \"{0}\""'
        working-directory: C:\isda-livestreamtool

    steps:
      - name: Pull latest code
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Install Python dependencies
        run: |
          pip install flask pygame visca-over-ip numpy pyyaml

      - name: Install Node dependencies
        run: |
          npm install

      - name: Build CSS
        run: |
          npm run build

      - name: Restart Flask app
        run: |
          # End any running task
          schtasks /End /TN "ISDA Live Stream" 2>$null
          Start-Sleep -Seconds 2
          # Run the updated task
          schtasks /Run /TN "ISDA Live Stream"
          Start-Sleep -Seconds 5

      - name: Verify app is running
        run: |
          $resp = Invoke-WebRequest -Uri http://localhost:5000/ -TimeoutSec 5 -ErrorAction SilentlyContinue
          if (-not $resp -or $resp.StatusCode -ne 200) {
            throw "Flask app is not responding"
          }
          Write-Output "Flask app is running (HTTP $($resp.StatusCode))"

