# ISDA Live Stream Tools — example configuration
#
# Copy this file to `config.yaml` and fill in your own values.
# `config.yaml` is gitignored — never commit it.

# --- OBS Studio (WebSocket) ------------------------------------------------
obs:
  ip: "127.0.0.1"
  port: 4455
  password: "CHANGE_ME"

# --- PTZ cameras & OSEE GoStream Deck --------------------------------------
ptz:
  # VISCA-over-IP camera addresses
  cameras:
    - "192.168.1.12"
  # OSEE GoStream Deck (transitions)
  osee_host: "192.168.1.10"
  osee_port: 19010
  osee_cut_transition: ""
  osee_auto_transition: ""

  # Joystick axis → camera speed interpolation tables.
  # Keys are (joystick_value, camera_speed); values between points are
  # linearly interpolated.
  sensitivity:
    pan:  { joy: [0, 0.02, 0.1, 0.3, 0.4, 0.5], cam: [0, 0, 1, 4, 7, 10] }
    tilt: { joy: [0, 0.04, 0.1, 0.3, 0.4, 0.5], cam: [0, 0, 1, 3, 7, 9] }
    zoom: { joy: [0, 0.05, 0.5],                 cam: [0, 0, 3] }

  # Invert axis directions
  invert_pan: false
  invert_tilt: false
  invert_zoom: true

  # Game controller button/axis mappings (pygame IDs).
  # From visca-joystick main.py — matches 8BitDo Ultimate 2C.
  controls:
    axes:
      ZOOM: 1        # Left stick Y
      PAN: 3         # Right stick X
      TILT: 4        # Right stick Y
      PAN_LEFT: 2    # Left trigger
      PAN_RIGHT: 5   # Right trigger
    buttons:
      QUICK_ZOOM: 9    # L3 (left stick click)
      QUICK_PAN: 10    # R3 (right stick click)
      RESET_POSITION: 1   # B
      TRANSITION_CUT: 4   # LB
      TRANSITION_AUTO: 5  # RB
    buttons_hold:
      TRACKING_TOGGLE: 0  # A
    hats:
      EXPOSURE_UP: [0, 1]
      EXPOSURE_DOWN: [0, -1]
      FOCUS_FAR: [1, 0]
      FOCUS_NEAR: [-1, 0]

  # How often to poll the controller (seconds)
  poll_interval: 0.03
  # Auto-reconnect interval (seconds)
  reconnect_interval: 5
  # Hold threshold for long-press detection (seconds)
  long_press_time: 1.0

# --- Flask app --------------------------------------------------------------
app:
  host: "0.0.0.0"
  port: 5000
  debug: false

# --- GPU watchdog (NVIDIA) ------------------------------------------------------
# Polls nvidia-smi and shows a desktop popup (kdialog/zenity/notify-send) when
# the GPU has been lost (Xid 79 "GPU fell off the bus"); NVENC encoding then
# fails until the machine is rebooted. The watchdog only warns — it never
# reboots by itself.
gpu_watchdog:
  enabled: true
  # Seconds between nvidia-smi checks
  poll_interval: 30
  # Popup tool: "kdialog", "zenity", "notify-send", or leave empty to auto-detect
  popup_program: ""
  popup_title: "GPU lost — reboot required"
  popup_text: >
    The NVIDIA GPU is no longer reachable (Xid 79, GPU fell off the bus).
    Hardware video encoding will fail until the machine is rebooted.
    Please reboot this computer when convenient.
